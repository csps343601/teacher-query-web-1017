<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台北中山站 - 即時空氣品質監測</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; transition: background-color 0.8s ease;
            background-color: #f0f2f5;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 900px; min-height: 550px;
            display: flex; flex-direction: column;
            justify-content: space-between; position: relative;
        }
        .header { text-align: center; }
        h1 { font-size: 28px; color: #333; margin-bottom: 5px; }
        .station-tag {
            background: #eee; padding: 4px 15px;
            border-radius: 20px; font-size: 16px; color: #555;
        }
        .main-display {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            align-items: center; text-align: center; margin: 30px 0;
        }
        .aqi-val { font-size: 110px; font-weight: bold; line-height: 1; }
        .emoji { font-size: 100px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .status-text {
            font-size: 45px; font-weight: bold; padding: 10px;
            background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .tip-box {
            background: rgba(255,255,255,0.7); padding: 15px;
            border-radius: 12px; margin: 15px 0; font-size: 20px;
            border-left: 8px solid #ccc; text-align: center;
        }
        .grid-detail {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
        }
        .item {
            background: white; padding: 12px 5px; border-radius: 10px;
            text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .label { font-size: 12px; color: #888; margin-bottom: 5px; }
        .value { font-size: 18px; font-weight: bold; }
        .unit { font-size: 10px; color: #aaa; display: block; }
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 100; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            border-radius: 20px;
        }
        .update-time { text-align: center; color: #999; font-size: 12px; margin-top: 15px; }
    </style>
</head>
